<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ink Strike</title>
<style>
  :root{
    --ink:#1E272E;
    --ink-deep:#141B21;
    --paper:#E9E1CE;
    --paper-line:#C6BAA0;
    --cinnabar:#C1352B;
    --jade:#7FA88B;
    --bone:#9DA9AE;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: Georgia, "Songti SC", "Times New Roman", serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overscroll-behavior:none}
  body{
    background:var(--ink-deep);color:var(--paper);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  #app{
    height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background:radial-gradient(120% 60% at 50% 0%, #26323A 0%, var(--ink) 55%, var(--ink-deep) 100%);
  }

  #hud{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 4px;gap:10px}
  #score{
    font:inherit;font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
    background:transparent;border:0;color:var(--paper);padding:0;cursor:pointer;
    display:flex;align-items:baseline;gap:7px;
  }
  #score .flag{
    font-size:11px;font-weight:600;color:var(--cinnabar);
    border:1px solid var(--cinnabar);border-radius:2px;padding:1px 5px;
  }
  #score .flag:empty, #score .flag.none{display:none}
  #score:focus-visible, #pace:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
  #hud .right{display:flex;align-items:center;gap:9px}
  #pace{
    font:inherit;font-size:12px;font-weight:600;color:var(--bone);
    background:transparent;border:1px solid #46545E;border-radius:2px;padding:5px 9px;cursor:pointer;
  }
  #mult{font-size:19px;font-weight:650;color:var(--jade);font-variant-numeric:tabular-nums;transition:color .2s}
  #mult.hit{color:var(--cinnabar)}
  #comboBar{width:60px;height:5px;background:#33414A;border-radius:3px;overflow:hidden}
  #comboBar i{display:block;height:100%;width:0%;background:var(--jade);transition:width .25s ease}

  #lane{position:relative;flex:1 1 auto;min-height:110px;margin:0 12px;border-bottom:2px solid #3A4750}
  .foe{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);
       display:flex;flex-direction:column;align-items:center;gap:4px;will-change:top}
  .foe .blot{
    display:flex;align-items:center;justify-content:center;
    background:#0E1418;color:var(--paper);border:1px solid #46545E;
    font-family:var(--serif);line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  .foe.small .blot{width:52px;height:52px;font-size:26px;border-radius:52% 48% 55% 45% / 50% 55% 45% 50%}
  .foe.big .blot{padding:0 14px;height:62px;font-size:29px;letter-spacing:.08em;
    border-radius:46% 54% 52% 48% / 55% 45% 55% 45%;border-color:var(--cinnabar)}
  .foe.revisit .blot{border-style:dashed;border-color:var(--jade)}
  .foe.active .blot{border-color:var(--paper);border-style:solid}
  .foe .tick{width:2px;height:10px;background:#46545E}
  .foe.burst{animation:burst .38s ease-out forwards}
  @keyframes burst{to{transform:translate(-50%,-50%) scale(1.6);opacity:0;filter:blur(3px)}}
  .foe.breach{animation:breach .3s ease-in forwards}
  @keyframes breach{to{transform:translate(-50%,-50%) scale(.5);opacity:0}}

  #banner{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;pointer-events:none;
    opacity:0;transition:opacity .35s;
  }
  #banner.show{opacity:1}
  #banner .comp{font-family:var(--serif);font-size:60px;color:var(--cinnabar);line-height:1}
  #banner.review .comp{color:var(--jade);font-size:46px}
  #banner .lbl{font-size:13px;color:var(--bone);letter-spacing:.04em}

  #deck{flex:0 0 auto;padding:12px 0 4px;display:flex;flex-direction:column;align-items:center}
  #paper{
    position:relative;background:var(--paper);box-shadow:0 10px 30px rgba(0,0,0,.5);touch-action:none;
    background-image:
      linear-gradient(to right, transparent calc(50% - 1px), var(--paper-line) calc(50% - 1px), var(--paper-line) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(to bottom, transparent calc(50% - 1px), var(--paper-line) calc(50% - 1px), var(--paper-line) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(to bottom right, transparent calc(50% - .5px), var(--paper-line) calc(50% - .5px), var(--paper-line) calc(50% + .5px), transparent calc(50% + .5px)),
      linear-gradient(to bottom left, transparent calc(50% - .5px), var(--paper-line) calc(50% - .5px), var(--paper-line) calc(50% + .5px), transparent calc(50% + .5px));
  }
  #paper.flash{animation:flash .3s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 6px var(--jade),0 10px 30px rgba(0,0,0,.5)}100%{box-shadow:0 10px 30px rgba(0,0,0,.5)}}
  #paper.wrong{animation:shake .22s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  #target{position:absolute;inset:0}
  #gloss{margin-top:10px;text-align:center;min-height:46px}
  #pinyin{display:block;font-family:var(--serif);font-size:19px}
  #meaning{display:block;font-size:14px;color:var(--bone);margin-top:2px}
  #progress{display:block;font-size:12px;color:var(--jade);margin-top:3px;min-height:14px}

  /* overlays */
  .sheet{
    position:fixed;inset:0;background:rgba(20,27,33,.96);z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;padding:26px;text-align:center;overflow-y:auto;
  }
  .sheet.hidden{display:none}
  #veil h1{font-family:var(--serif);font-size:34px;font-weight:400}
  #veil h1 .zh{display:block;font-size:48px;color:var(--cinnabar);margin-bottom:4px}
  #veil p{color:var(--bone);font-size:14px;line-height:1.5;max-width:32ch}
  .setting{margin-top:14px;width:100%;max-width:340px}
  .setting > span{display:block;font-size:12px;color:var(--bone);margin-bottom:6px}
  .chips{display:flex;gap:6px;justify-content:center}
  .chips button{
    flex:1;font:inherit;font-size:13px;padding:9px 4px;cursor:pointer;
    background:transparent;color:var(--bone);border:1px solid #46545E;border-radius:2px;
  }
  .chips button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:600}
  .chips button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
  .primary{
    margin-top:22px;padding:14px 30px;font:inherit;font-size:17px;font-weight:600;
    background:var(--cinnabar);color:var(--paper);border:0;border-radius:2px;cursor:pointer;
  }
  .primary:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
  #veilNote{min-height:18px;font-size:13px;margin-top:8px}
  .ghost{
    margin-top:12px;padding:11px 20px;font:inherit;font-size:14px;
    background:transparent;color:var(--bone);border:1px solid #46545E;border-radius:2px;cursor:pointer;
  }
  .ghost:disabled{opacity:.6;cursor:default}
  .ghost.hidden{display:none}
  .ghost:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
  .err{color:var(--cinnabar)}

  /* stats sheet */
  #stats h2{font-family:var(--serif);font-size:26px;font-weight:400;margin-bottom:2px}
  #stats .sub{font-size:13px;color:var(--bone);margin-bottom:14px}
  #rows{width:100%;max-width:360px;display:flex;flex-direction:column;gap:1px}
  .row{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid #2C373E;text-align:left}
  .row .ch{font-family:var(--serif);font-size:32px;line-height:1;width:40px;text-align:center}
  .row .mid{flex:1;min-width:0}
  .row .py{font-family:var(--serif);font-size:15px}
  .row .gl{font-size:12px;color:var(--bone);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .tally{font-size:11px;color:var(--cinnabar);text-align:right;line-height:1.4}
  .row .tally b{display:block;font-weight:600}
  .empty{color:var(--bone);font-size:14px;max-width:30ch;line-height:1.5}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <button id="score" type="button" aria-label="Score — tap for your trouble list">
      <span id="scoreNum">0</span><span class="flag none" id="flag"></span>
    </button>
    <div class="right">
      <button id="pace" type="button">Calm</button>
      <div id="comboBar"><i></i></div>
      <div id="mult">×1</div>
    </div>
  </header>
  <section id="lane"><div id="banner"><span class="comp"></span><span class="lbl"></span></div></section>
  <section id="deck">
    <div id="paper"><div id="target"></div></div>
    <div id="gloss"><span id="pinyin"></span><span id="meaning"></span><span id="progress"></span></div>
  </section>
</div>

<div id="veil" class="sheet">
  <h1><span class="zh">笔阵</span>Ink Strike</h1>
  <p>Characters come at you in waves that share a radical. Write each one before it reaches the desk — stroke order and direction both count. Every third wave sends back the ones you keep dropping.</p>

  <div class="setting"><span>Vocabulary</span>
    <div class="chips" id="setLevel">
      <button type="button" data-v="2">HSK 1–2</button>
      <button type="button" data-v="3">HSK 1–3</button>
      <button type="button" data-v="4" aria-pressed="true">HSK 1–4</button>
    </div>
  </div>
  <div class="setting"><span>Writing</span>
    <div class="chips" id="setMode">
      <button type="button" data-v="trace" aria-pressed="true">Trace the outline</button>
      <button type="button" data-v="blank">Blank grid</button>
    </div>
  </div>
  <div class="setting"><span>Pace — you can change this mid-run</span>
    <div class="chips" id="setPace">
      <button type="button" data-v="0" aria-pressed="true">Calm</button>
      <button type="button" data-v="1">Steady</button>
      <button type="button" data-v="2">Brisk</button>
    </div>
  </div>

  <div id="veilNote"></div>
  <button id="go" class="primary" type="button">Start writing</button>
  <button id="save" class="ghost hidden" type="button">Save an offline copy</button>
</div>

<div id="stats" class="sheet hidden">
  <h2>Trouble list</h2>
  <div class="sub" id="statsSub"></div>
  <div id="rows"></div>
  <button id="resume" class="primary" type="button">Back to writing</button>
</div>

<!--OFFLINE_BUNDLE-->
<script>
(function(){
  "use strict";

  /* ---------- content: grouped by shared component, HSK 1–4 ---------- */
  const GROUPS = [
    {comp:"氵", name:"water", chars:[
      ["汉","hàn","Han / Chinese",1],["没","méi","not have",1],["洗","xǐ","to wash",2],
      ["游","yóu","to swim, to roam",2],["海","hǎi","sea",3],["河","hé","river",3],
      ["渴","kě","thirsty",3],["清","qīng","clear",3],["汤","tāng","soup",3],
      ["满","mǎn","full",4],["深","shēn","deep",4]],
     words:[["游泳","yóu yǒng","to swim",2],["洗澡","xǐ zǎo","to bathe",3],["清楚","qīng chu","clear",3]]},

    {comp:"扌", name:"hand", chars:[
      ["打","dǎ","to hit",1],["找","zhǎo","to look for",2],["换","huàn","to change",3],
      ["接","jiē","to receive",3],["排","pái","to arrange",3],["提","tí","to lift, to raise",3],
      ["推","tuī","to push",4],["拉","lā","to pull",4],["抬","tái","to lift",4],
      ["抱","bào","to hug",4],["掉","diào","to drop",4]],
     words:[["提高","tí gāo","to raise",3],["打扮","dǎ ban","to dress up",4],["抱歉","bào qiàn","to be sorry",4]]},

    {comp:"口", name:"mouth", chars:[
      ["吃","chī","to eat",1],["叫","jiào","to call",1],["吗","ma","question particle",1],
      ["喝","hē","to drink",1],["呢","ne","particle",1],["唱","chàng","to sing",2],
      ["哭","kū","to cry",3],["咳","ké","to cough",4],["咸","xián","salty",4],["味","wèi","taste",4]],
     words:[["吃饭","chī fàn","to eat a meal",1],["咖啡","kā fēi","coffee",2],["唱歌","chàng gē","to sing",2]]},

    {comp:"木", name:"tree", chars:[
      ["机","jī","machine",1],["校","xiào","school",1],["果","guǒ","fruit",1],
      ["椅","yǐ","chair",2],["板","bǎn","board",3],["极","jí","extremely",3],
      ["树","shù","tree",3],["林","lín","woods",4],["森","sēn","forest",4],["桥","qiáo","bridge",4]],
     words:[["学校","xué xiào","school",1],["机会","jī huì","opportunity",3],["森林","sēn lín","forest",4]]},

    {comp:"忄心", name:"heart", chars:[
      ["想","xiǎng","to think",1],["忙","máng","busy",2],["快","kuài","fast",2],
      ["慢","màn","slow",2],["意","yì","meaning",2],["怕","pà","to fear",3],
      ["情","qíng","feeling",3],["感","gǎn","to feel",3],["忘","wàng","to forget",3],["愿","yuàn","willing",4]],
     words:[["忘记","wàng jì","to forget",3],["心情","xīn qíng","mood",4],["感情","gǎn qíng","feelings",4]]},

    {comp:"讠", name:"speech", chars:[
      ["说","shuō","to speak",1],["话","huà","speech",1],["请","qǐng","please",1],
      ["谢","xiè","to thank",1],["语","yǔ","language",1],["试","shì","to try",2],
      ["课","kè","lesson",2],["认","rèn","to recognise",3],["记","jì","to record",3],
      ["词","cí","word",3],["讲","jiǎng","to speak",3]],
     words:[["说话","shuō huà","to talk",1],["谢谢","xiè xie","thank you",1],["认真","rèn zhēn","conscientious",4]]},

    {comp:"纟", name:"silk", chars:[
      ["红","hóng","red",2],["给","gěi","to give",2],["经","jīng","to pass through",2],
      ["练","liàn","to practise",3],["绿","lǜ","green",3],["结","jié","knot",4],
      ["纸","zhǐ","paper",4],["续","xù","to continue",4]],
     words:[["经过","jīng guò","to pass by",3],["练习","liàn xí","to practise",3],["结婚","jié hūn","to marry",3]]},

    {comp:"日", name:"sun", chars:[
      ["明","míng","bright",1],["星","xīng","star",1],["昨","zuó","yesterday",1],
      ["早","zǎo","early",2],["时","shí","time",2],["晚","wǎn","late",2],
      ["晴","qíng","clear sky",2],["春","chūn","spring",3],["暖","nuǎn","warm",4]],
     words:[["时间","shí jiān","time",2],["春天","chūn tiān","spring",3],["明星","míng xīng","a star",4]]},

    {comp:"辶", name:"movement", chars:[
      ["这","zhè","this",1],["过","guò","to pass",2],["还","hái","still",2],
      ["送","sòng","to send",2],["近","jìn","near",2],["进","jìn","to enter",2],
      ["远","yuǎn","far",2],["边","biān","side",3],["迎","yíng","to welcome",3],
      ["迟","chí","late",4],["遍","biàn","time (measure)",4]],
     words:[["附近","fù jìn","nearby",3],["欢迎","huān yíng","to welcome",3],["迟到","chí dào","to be late",4]]},

    {comp:"宀", name:"roof", chars:[
      ["家","jiā","home",1],["完","wán","to finish",2],["室","shì","room",2],
      ["安","ān","peace",3],["客","kè","guest",3],["定","dìng","to fix",3],
      ["空","kōng","empty",4],["富","fù","rich",4],["宿","sù","to stay overnight",4]],
     words:[["完成","wán chéng","to complete",3],["客人","kè rén","guest",3],["安静","ān jìng","quiet",3]]},

    {comp:"⻊", name:"foot", chars:[
      ["跑","pǎo","to run",2],["路","lù","road",2],["跳","tiào","to jump",3],
      ["踢","tī","to kick",3],["跟","gēn","to follow",3]],
     words:[["跑步","pǎo bù","to run",2],["跳舞","tiào wǔ","to dance",2],["路口","lù kǒu","intersection",3]]},

    {comp:"雨", name:"rain", chars:[
      ["零","líng","zero",1],["雪","xuě","snow",2],["需","xū","to need",3],
      ["雷","léi","thunder",4],["雾","wù","fog",4]],
     words:[["下雪","xià xuě","to snow",2],["需要","xū yào","to need",3]]},

    {comp:"艹", name:"grass", chars:[
      ["茶","chá","tea",1],["菜","cài","dish, vegetable",1],["花","huā","flower",3],
      ["药","yào","medicine",3],["蓝","lán","blue",3],["草","cǎo","grass",3],
      ["节","jié","festival, node",3],["苦","kǔ","bitter",4]],
     words:[["节目","jié mù","programme",3],["花园","huā yuán","garden",4]]},

    {comp:"钅", name:"metal", chars:[
      ["钱","qián","money",2],["钟","zhōng","clock",2],["错","cuò","wrong",2],
      ["银","yín","silver",3],["铁","tiě","iron",4],["镜","jìng","mirror",4]],
     words:[["银行","yín háng","bank",3],["错误","cuò wù","mistake",4]]},

    {comp:"女", name:"woman", chars:[
      ["好","hǎo","good",1],["她","tā","she",1],["妈","mā","mother",1],
      ["姐","jiě","elder sister",1],["妹","mèi","younger sister",2],["姓","xìng","surname",2],
      ["始","shǐ","to begin",2],["婚","hūn","marriage",3],["安","ān","peace",3]],
     words:[["妈妈","mā ma","mum",1],["姐姐","jiě jie","elder sister",1],["开始","kāi shǐ","to begin",2]]}
  ];

  /* ---------- config ---------- */
  const MARCH_BASE=32000, MARCH_FLOOR=17000, SPAWN_BASE=7000, SPAWN_FLOOR=4200;
  const PACES=[{name:"Calm",march:1.35,spawn:1.25},{name:"Steady",march:1,spawn:1},{name:"Brisk",march:.72,spawn:.8}];
  const WAVE_SIZE=7, MAX_LANE=3, BIG_CHANCE=.34, LENIENCY=1.0, HINT_AFTER=4;
  const REVIEW_EVERY=3, REVIEW_MIN=3, REVIEW_POOL=5;
  const W_MISS=1, W_BREACH=3, W_HEAL=1, W_HEAL_REVIEW=2;

  /* ---------- state ---------- */
  const S = {
    score:0, streak:0, mult:1, foes:[], running:false, paused:false, t:0, lastSpawn:-1e9,
    writer:null, cleanChar:true, id:0,
    wave:0, waveLeft:0, group:null, lastGroup:null, review:false,
    level:4, mode:"trace", pace:0
  };
  const STATS = Object.create(null);   // char -> record, session only

  const $ = s=>document.querySelector(s);
  const lane=$("#lane"), paper=$("#paper"), target=$("#target"), banner=$("#banner");
  const elScoreNum=$("#scoreNum"), elFlag=$("#flag"), elMult=$("#mult"), elBar=$("#comboBar i"), elPace=$("#pace");
  const elPinyin=$("#pinyin"), elMeaning=$("#meaning"), elProg=$("#progress");
  const veil=$("#veil"), veilNote=$("#veilNote"), go=$("#go");
  const statsSheet=$("#stats"), rows=$("#rows"), statsSub=$("#statsSub");

  function sizePaper(){
    const side = Math.min(window.innerWidth*0.84, window.innerHeight*0.40);
    paper.style.width=side+"px"; paper.style.height=side+"px";
  }
  sizePaper(); window.addEventListener("resize", sizePaper);

  /* ---------- weakness bookkeeping ---------- */
  function rec(ch){
    let r = STATS[ch];
    if(!r) r = STATS[ch] = {ch, py:"", gl:"", miss:0, breach:0, done:0, w:0};
    return r;
  }
  function note(ch, py, gl, standalone){
    const r = rec(ch);
    if(standalone || !r.py){ r.py = py; r.gl = gl; }
    return r;
  }
  function troubled(){
    return Object.values(STATS).filter(r=>r.w>0).sort((a,b)=>b.w-a.w || b.breach-a.breach);
  }
  function refreshFlag(){
    const n = troubled().length;
    elFlag.textContent = n ? n+" shaky" : "";
    elFlag.classList.toggle("none", !n);
  }

  /* ---------- settings ---------- */
  function wireChips(id, fn){
    const box = document.getElementById(id);
    box.addEventListener("click", e=>{
      const b = e.target.closest("button"); if(!b) return;
      [...box.querySelectorAll("button")].forEach(x=>x.setAttribute("aria-pressed", x===b));
      fn(b.dataset.v);
    });
  }
  wireChips("setLevel", v=>S.level=+v);
  wireChips("setMode",  v=>S.mode=v);
  wireChips("setPace",  v=>{S.pace=+v; applyPace();});

  elPace.addEventListener("click", ()=>{
    S.pace=(S.pace+1)%PACES.length; applyPace();
    const box=document.getElementById("setPace");
    [...box.querySelectorAll("button")].forEach(b=>b.setAttribute("aria-pressed", +b.dataset.v===S.pace));
  });

  function applyPace(){
    elPace.textContent = PACES[S.pace].name;
    for(const foe of S.foes){
      const p=(S.t-foe.born)/foe.dur;
      foe.dur = marchFor(foe.big);
      foe.born = S.t - p*foe.dur;
    }
  }

  /* ---------- pools ---------- */
  const inLevel = r=>r[3] <= S.level;
  const eligible = g=>({chars:g.chars.filter(inLevel), words:g.words.filter(inLevel)});
  const pick = a=>a[Math.floor(Math.random()*a.length)];

  function pickGroup(){
    const ok = GROUPS.filter(g=>eligible(g).chars.length>=4 && g!==S.lastGroup);
    const pool = ok.length ? ok : GROUPS.filter(g=>eligible(g).chars.length>=3);
    const g = pick(pool); S.lastGroup = g; return g;
  }

  /* ---------- waves ---------- */
  function nextWave(){
    S.wave++;
    const pool = troubled();
    S.review = (S.wave % REVIEW_EVERY === 0) && pool.length >= REVIEW_MIN;
    S.group = S.review ? null : pickGroup();
    S.waveLeft = WAVE_SIZE;
    S.lastSpawn = S.t + 900;
    banner.classList.toggle("review", S.review);
    banner.querySelector(".comp").textContent = S.review ? "复习" : S.group.comp;
    banner.querySelector(".lbl").textContent = S.review
      ? "wave "+S.wave+" · the ones you keep dropping"
      : "wave "+S.wave+" · "+S.group.name;
    banner.classList.add("show");
    setTimeout(()=>banner.classList.remove("show"), 1700);
  }

  function marchFor(big){
    const ramp = Math.min(1, (S.wave-1)/12);
    return (MARCH_BASE-(MARCH_BASE-MARCH_FLOOR)*ramp) * PACES[S.pace].march * (big?1.5:1);
  }
  function spawnGap(){
    const ramp = Math.min(1, (S.wave-1)/12);
    return (SPAWN_BASE-(SPAWN_BASE-SPAWN_FLOOR)*ramp) * PACES[S.pace].spawn;
  }

  function nextRow(){
    if(S.review){
      const pool = troubled().slice(0, REVIEW_POOL);
      if(!pool.length) return {row:[pick(eligible(pickGroup()).chars)[0]], big:false};
      // weight by how shaky it is
      const bag=[]; pool.forEach(r=>{ const n=Math.min(4,Math.ceil(r.w/2)); for(let i=0;i<n;i++) bag.push(r); });
      const r = pick(bag);
      return {row:[r.ch, r.py, r.gl, 0], big:false};
    }
    const pool = eligible(S.group);
    const big = pool.words.length && Math.random() < BIG_CHANCE;
    return {row: big ? pick(pool.words) : pick(pool.chars), big};
  }

  function makeFoe(){
    const {row, big} = nextRow();
    const chars = Array.from(row[0]);
    const syls = String(row[1]).split(" ");
    chars.forEach((c,i)=>note(c, syls[i]||row[1], chars.length>1 ? row[2]+" ("+row[0]+")" : row[2], chars.length===1));
    const foe = {
      id:++S.id, big, chars, syls, pinyin:row[1], meaning:row[2],
      idx:0, dur:marchFor(big), born:S.t, review:S.review
    };
    const el = document.createElement("div");
    el.className = "foe " + (big?"big":"small") + (S.review?" revisit":"");
    el.innerHTML = '<div class="blot">'+row[0]+'</div><div class="tick"></div>';
    lane.appendChild(el); foe.el = el; S.foes.push(foe);
  }

  function removeFoe(foe, cls){
    foe.el.classList.add(cls);
    const el = foe.el; setTimeout(()=>el.remove(), 420);
    S.foes = S.foes.filter(f=>f!==foe);
  }

  /* ---------- scoring ---------- */
  function setMult(){
    S.mult = Math.min(8, 1+Math.floor(S.streak/3));
    elMult.textContent = "×"+S.mult;
    elBar.style.width = (S.mult>=8?100:((S.streak%3)/3)*100)+"%";
  }
  function add(n){ S.score += Math.round(n); elScoreNum.textContent = S.score; }
  function penalise(hard){
    S.streak = hard ? 0 : Math.max(0, S.streak-3);
    setMult();
    elMult.classList.add("hit");
    setTimeout(()=>elMult.classList.remove("hit"), 260);
  }

  /* ---------- writing ---------- */
  let activeFoe = null;

  function refreshGloss(foe){
    elPinyin.textContent = foe.pinyin;
    elMeaning.textContent = foe.meaning;
    elProg.textContent = foe.chars.length>1 ? "character "+(foe.idx+1)+" of "+foe.chars.length : "";
  }

  function mountChar(foe){
    if(S.writer){ try{ S.writer.cancelQuiz(); }catch(e){} }
    target.innerHTML = ""; S.cleanChar = true;
    const side = paper.clientWidth;
    const ch = foe.chars[foe.idx];
    S.writer = window.HanziWriter.create(target, ch, {
      width:side, height:side, padding:Math.round(side*0.06),
      showCharacter:false, showOutline:S.mode==="trace",
      showHintAfterMisses:HINT_AFTER, highlightOnComplete:true,
      strokeColor:"#1E272E", outlineColor:"#C6BAA0",
      drawingColor:"#C1352B", highlightColor:"#7FA88B",
      drawingWidth:Math.max(16, Math.round(side*0.055)), leniency:LENIENCY,
      charDataLoader:loadCharData
    });
    S.writer.quiz({
      onCorrectStroke(){ add(10*S.mult); paper.classList.remove("wrong"); },
      onMistake(){
        S.cleanChar = false;
        const r = rec(ch); r.miss++; r.w += W_MISS;
        refreshFlag(); penalise(false);
        paper.classList.remove("wrong"); void paper.offsetWidth; paper.classList.add("wrong");
      },
      onComplete(){
        const r = rec(ch); r.done++;
        if(S.cleanChar) r.w = Math.max(0, r.w - (foe.review ? W_HEAL_REVIEW : W_HEAL));
        refreshFlag();
        add((100 + (S.cleanChar?50:0)) * S.mult * (S.mode==="blank"?1.5:1));
        S.streak++; setMult();
        paper.classList.remove("flash"); void paper.offsetWidth; paper.classList.add("flash");
        foe.idx++;
        if(foe.idx >= foe.chars.length){
          if(foe.big) add(150*S.mult);
          removeFoe(foe, "burst");
          activeFoe = null; target.innerHTML = ""; elProg.textContent = "";
          setTimeout(retarget, 260);
        }else{
          refreshGloss(foe);
          setTimeout(()=>mountChar(foe), 260);
        }
      }
    });
  }

  function retarget(){
    if(!S.running || S.paused) return;
    const front = S.foes[0];
    S.foes.forEach(f=>f.el.classList.remove("active"));
    if(!front){ activeFoe=null; target.innerHTML=""; elPinyin.textContent=""; elMeaning.textContent=""; return; }
    front.el.classList.add("active");
    if(front === activeFoe) return;
    activeFoe = front; refreshGloss(front); mountChar(front);
  }

  /* ---------- loop ---------- */
  let last = 0;
  function frame(ts){
    if(!S.running || S.paused) return;
    if(!last) last = ts;
    S.t += (ts-last); last = ts;

    if(S.waveLeft === 0 && S.foes.length === 0) nextWave();
    if(S.waveLeft > 0 && S.foes.length < MAX_LANE && S.t-S.lastSpawn > spawnGap()){
      S.lastSpawn = S.t; S.waveLeft--; makeFoe();
    }

    for(const foe of S.foes.slice()){
      const p = (S.t-foe.born)/foe.dur;
      foe.el.style.top = Math.min(100,p*100)+"%";
      if(p >= 1){
        const wasActive = (foe === activeFoe);
        const ch = foe.chars[foe.idx];
        const r = rec(ch); r.breach++; r.w += W_BREACH; refreshFlag();
        removeFoe(foe, "breach"); penalise(true);
        if(wasActive){
          if(S.writer){ try{ S.writer.cancelQuiz(); }catch(e){} }
          target.innerHTML = ""; activeFoe = null;
        }
      }
    }
    if(!activeFoe) retarget();
    requestAnimationFrame(frame);
  }

  /* ---------- stats sheet ---------- */
  function openStats(){
    if(!S.running) return;
    S.paused = true;
    if(S.writer){ try{ S.writer.cancelQuiz(); }catch(e){} }
    const list = troubled();
    statsSub.textContent = list.length
      ? "Every third wave sends these back at you."
      : "";
    rows.innerHTML = "";
    if(!list.length){
      rows.innerHTML = '<p class="empty">Nothing shaky yet. Characters land here when you write a wrong stroke or let one reach the desk.</p>';
    }else{
      list.slice(0,12).forEach(r=>{
        const d = document.createElement("div");
        d.className = "row";
        d.innerHTML =
          '<div class="ch">'+r.ch+'</div>'+
          '<div class="mid"><div class="py">'+(r.py||"")+'</div><div class="gl">'+(r.gl||"")+'</div></div>'+
          '<div class="tally"><b>'+r.miss+' wrong strokes</b>'+r.breach+' got through</div>';
        rows.appendChild(d);
      });
    }
    statsSheet.classList.remove("hidden");
  }
  function closeStats(){
    statsSheet.classList.add("hidden");
    S.paused = false; last = 0;
    activeFoe = null;
    retarget();
    requestAnimationFrame(frame);
  }
  $("#score").addEventListener("click", openStats);
  $("#resume").addEventListener("click", closeStats);

  /* ---------- stroke data: embedded first, CDN only as fallback ---------- */
  function loadCharData(ch, onComplete, onError){
    const bundled = window.HANZI_DATA && window.HANZI_DATA[ch];
    if(bundled){ onComplete(bundled); return; }
    fetch("https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/"+ch+".json")
      .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(onComplete)
      .catch(e=>{ if(onError) onError(e); });
  }

  /* ---------- library ---------- */
  const MARKER = "<!--OFFLINE_" + "BUNDLE-->";
  const DATA_BASE = "https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/";
  const SOURCES = [
    "https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js",
    "https://unpkg.com/hanzi-writer@3/dist/hanzi-writer.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/hanzi-writer/3.5.0/hanzi-writer.min.js"
  ];
  let LIB_USED = null;

  function loadScript(src){
    return new Promise((res,rej)=>{
      const s=document.createElement("script");
      s.src=src; s.onload=res; s.onerror=()=>rej(new Error(src));
      document.head.appendChild(s);
    });
  }
  async function ensureLib(){
    if(window.HanziWriter) return true;
    for(const src of SOURCES){
      try{ await loadScript(src); if(window.HanziWriter){ LIB_USED = src; return true; } }catch(e){}
    }
    return false;
  }

  /* ---------- make a self-contained copy, entirely in the browser ---------- */
  async function saveOffline(){
    const btn = $("#save");
    btn.disabled = true;
    try{
      btn.textContent = "Reading this page…";
      const src = await (await fetch(location.href)).text();
      if(src.indexOf(MARKER) === -1) throw new Error("This copy has no bundle marker.");

      const chars = Array.from(new Set(src.match(/[\u4e00-\u9fff]/g) || []));
      btn.textContent = "Fetching the library…";
      const lib = await (await fetch(LIB_USED || SOURCES[0])).text();

      const data = {};
      let done = 0, failed = 0;
      const queue = chars.slice();
      async function worker(){
        while(queue.length){
          const ch = queue.shift();
          try{
            const r = await fetch(DATA_BASE + ch + ".json");
            if(r.ok) data[ch] = await r.json(); else failed++;
          }catch(e){ failed++; }
          done++;
          btn.textContent = "Collecting strokes " + done + "/" + chars.length;
        }
      }
      await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);

      const payload = "<scr"+"ipt>\n" + lib +
        "\nwindow.HANZI_DATA=" + JSON.stringify(data) + ";\n<\/scr"+"ipt>";
      const blob = new Blob([src.replace(MARKER, payload)], {type:"text/html"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ink-strike-offline.html";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 30000);

      btn.textContent = "Saved" + (failed ? " (" + failed + " characters missing)" : " \u2014 open it from Files");
      veilNote.textContent = "That copy needs no network. Keep it in Files.";
    }catch(e){
      btn.textContent = "Save an offline copy";
      btn.disabled = false;
      veilNote.innerHTML = '<span class="err">Could not build the copy: ' + e.message + '</span>';
    }
  }

  /* ---------- boot ---------- */
  (async function boot(){
    applyPace();
    if(window.HANZI_DATA){ veilNote.textContent = "Stroke data is built in — no network needed."; return; }
    veilNote.textContent = "Loading stroke data\u2026";
    const ok = await ensureLib();
    if(ok){
      veilNote.textContent = "";
      $("#save").classList.remove("hidden");
    }else{
      veilNote.innerHTML = '<span class="err">Stroke data could not load. Safari blocks outside downloads for files opened from Files. Open this page from a web address instead, then tap \u201cSave an offline copy\u201d.</span>';
    }
  })();

  go.addEventListener("click", async ()=>{
    go.disabled = true;
    if(!window.HanziWriter && !(await ensureLib())){
      go.disabled = false; return;
    }
    veil.classList.add("hidden");
    S.running = true; S.t = 0; last = 0;
    applyPace(); setMult(); refreshFlag(); nextWave();
    requestAnimationFrame(frame);
  });

  $("#save").addEventListener("click", saveOffline);

  applyPace();
})();
</script>
</body>
</html>
